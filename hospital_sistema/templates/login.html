{% extends "base.html" %}

{% block content %}
<!-- Tela de Login -->
<div id="loginScreen" class="login-container">
    <div class="login-box">
        <div class="logo">
            <span>HOS</span>
        </div>
        <h1>Hospital de Olhos de Sergipe</h1>
        <p>Sistema de Gerenciamento</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" required>
            </div>
            
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
                <div class="senha-requisito">Mínimo 8 caracteres, letras, números e símbolos</div>
            </div>
            
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="rememberMe"> Lembre-se de mim
                </label>
                <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="btn-login">Log in</button>
        </form>
        
        <div class="divider">
            <span>ou</span>
        </div>
        
        <button class="btn-google" onclick="loginComGoogle()">
            <i class="fab fa-google"></i> Entrar com Google
        </button>
        
        <div class="cadastrar-link">
            Ainda não tem uma conta? <a href="#">Cadastre-se</a>
        </div>
        
        <div id="loginError" class="error-message" style="display: none;"></div>
    </div>
</div>

<!-- Sistema Principal (inicialmente oculto) -->
<div id="mainSystem" class="main-system" style="display: none;">
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-hospital-user"></i>
            <span>HOS - Hospital de Olhos de Sergipe</span>
        </div>
        <div class="nav-user">
            <span>👋 Bem-vindo, <span id="currentUser"></span></span>
            <button class="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </nav>
    
    <div class="dashboard">
        <!-- Aqui será carregado o dashboard via JS -->
        <div id="dashboardContent"></div>
    </div>
</div>

<script>
// Função de login
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainSystem').style.display = 'block';
            document.getElementById('currentUser').innerText = username;
            carregarDashboard();
        } else {
            const errorDiv = document.getElementById('loginError');
            errorDiv.innerText = data.message;
            errorDiv.style.display = 'block';
        }
    });
});

function loginComGoogle() {
    // Implementar login com Google OAuth
    showNotification('Login com Google em desenvolvimento', 'info');
}

function fazerLogout() {
    fetch('/api/logout', { method: 'POST' })
        .then(() => {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainSystem').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });
}
</script>
{% endblock %}

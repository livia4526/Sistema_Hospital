{% extends "base.html" %}

{% block content %}
<div class="main-system">
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-hospital-user"></i>
            <span>HOS - Hospital de Olhos de Sergipe</span>
        </div>
        <div class="nav-user">
            <span>👋 Bem-vindo, <span id="currentUser">{{ session.username }}</span></span>
            <button class="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </nav>
    
    <div class="dashboard" style="max-width: 800px; margin: 0 auto;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
                <i class="fas fa-search" style="font-size: 32px; color: var(--primary-blue);"></i>
                <h2 style="color: var(--primary-blue); margin: 0;">Resultados da Busca</h2>
            </div>
            
            <div class="form-group">
                <input type="text" id="searchInput" class="form-input" placeholder="Digite nome ou CPF" value="{{ termo }}">
                <button class="btn btn-primary mt-20" onclick="buscarPacientes()" style="margin-top: 10px;">
                    <i class="fas fa-search"></i> Buscar novamente
                </button>
            </div>
            
            <div id="buscaResultados" class="busca-resultados">
                <!-- Resultados serão carregados via JS -->
                <div class="text-center">Carregando...</div>
            </div>
            
            <div style="margin-top: 30px; text-align: center;">
                <button class="btn btn-secondary" onclick="voltar()">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const origem = '{{ request.args.get("origem", "") }}';
    const tipo = '{{ request.args.get("tipo", "") }}';
    const termoInicial = '{{ request.args.get("q", "") }}';
    
    document.addEventListener('DOMContentLoaded', function() {
        if (termoInicial) {
            document.getElementById('searchInput').value = termoInicial;
            buscarPacientes();
        }
    });
    
    function buscarPacientes() {
        const termo = document.getElementById('searchInput').value;
        if (!termo || termo.length < 2) {
            showNotification('Digite pelo menos 2 caracteres', 'warning');
            return;
        }
        
        showLoading();
        
        fetch(`/api/pacientes/buscar?q=${encodeURIComponent(termo)}`)
            .then(response => response.json())
            .then(data => {
                hideLoading();
                
                const container = document.getElementById('buscaResultados');
                
                if (data.pacientes.length === 0) {
                    container.innerHTML = `
                        <div class="alerta-item alerta-info text-center">
                            <i class="fas fa-user-slash"></i> Nenhum paciente encontrado
                        </div>
                        <div class="text-center mt-20">
                            <button class="btn btn-success" onclick="irParaNovoPaciente()">
                                <i class="fas fa-user-plus"></i> Cadastrar novo paciente
                            </button>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = data.pacientes.map(paciente => `
                    <div class="resultado-card" onclick="selecionarPaciente(${paciente.id})">
                        <div class="resultado-nome">👤 ${paciente.nome}</div>
                        <div class="resultado-info">
                            <span>📄 CPF: ${paciente.cpf}</span>
                            <span>📞 ${paciente.telefone}</span>
                        </div>
                        <div class="resultado-info">
                            <span>🏥 ${paciente.plano || 'Sem plano'}</span>
                            <span>🎂 ${paciente.idade} anos</span>
                        </div>
                        <div class="resultado-stats">
                            <div class="resultado-stat">🩺 ${paciente.total_consultas} consultas</div>
                            <div class="resultado-stat">🔪 ${paciente.total_cirurgias} cirurgias</div>
                            <div class="resultado-stat">📅 Última: ${paciente.ultima_consulta || 'N/A'}</div>
                        </div>
                        <div class="bolinhas">
                            ${paciente.tem_consulta_agendada ? '<div class="bolinha bolinha-amarela" title="Consulta agendada"></div>' : ''}
                            ${paciente.total_faltas > 0 ? '<div class="bolinha bolinha-vermelha" title="Paciente faltou"></div>' : ''}
                            ${paciente.total_consultas > 0 ? '<div class="bolinha bolinha-verde" title="Consultas realizadas"></div>' : ''}
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => {
                hideLoading();
                console.error('Erro na busca:', error);
                showNotification('Erro ao buscar pacientes', 'error');
            });
    }
    
    function selecionarPaciente(pacienteId) {
        if (origem === 'agendamento') {
            // Buscar dados do paciente e redirecionar para agendamento
            fetch(`/api/pacientes/${pacienteId}`)
                .then(response => response.json())
                .then(paciente => {
                    sessionStorage.setItem('pacienteAgendamento', JSON.stringify(paciente));
                    window.location.href = `/${tipo}/nova`;
                });
        } else {
            // Abrir detalhes do paciente
            window.location.href = `/paciente/detalhes/${pacienteId}`;
        }
    }
    
    function irParaNovoPaciente() {
        window.location.href = `/paciente/novo?origem=agendamento&tipo=${tipo}`;
    }
    
    function voltar() {
        if (origem === 'agendamento') {
            window.location.href = `/verificar-cadastro?tipo=${tipo}`;
        } else {
            window.location.href = '/';
        }
    }
    
    function fazerLogout() {
        fetch('/api/logout', { method: 'POST' })
            .then(() => window.location.href = '/');
    }
</script>
{% endblock %}

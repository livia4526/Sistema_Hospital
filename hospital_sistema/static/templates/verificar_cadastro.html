{% extends "base.html" %}

{% block content %}
<div class="main-system">
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-hospital-user"></i>
            <span>HOS - Hospital de Olhos de Sergipe</span>
        </div>
        <div class="nav-user">
            <span>👋 Bem-vindo, <span id="currentUser">{{ session.username }}</span></span>
            <button class="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </nav>
    
    <div class="dashboard" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="card" style="max-width: 500px; width: 100%; text-align: center;">
            <div class="logo" style="margin: 0 auto 20px; width: 80px; height: 80px; background: var(--primary-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-question" style="font-size: 40px; color: white;"></i>
            </div>
            <h2 style="color: var(--primary-blue); margin-bottom: 10px;">HOS</h2>
            <p style="margin-bottom: 30px;">O paciente possui cadastro?</p>
            
            <div style="display: flex; gap: 20px; justify-content: center;">
                <button class="btn btn-primary" style="padding: 15px 40px; font-size: 18px;" onclick="pacienteCadastrado(true)">
                    <i class="fas fa-check"></i> Sim
                </button>
                <button class="btn btn-secondary" style="padding: 15px 40px; font-size: 18px;" onclick="pacienteCadastrado(false)">
                    <i class="fas fa-times"></i> Não
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const tipoAgendamento = sessionStorage.getItem('tipoAgendamento') || 'consulta';
    
    function pacienteCadastrado(temCadastro) {
        if (temCadastro) {
            // Redirecionar para busca
            window.location.href = `/buscar?origem=agendamento&tipo=${tipoAgendamento}`;
        } else {
            // Redirecionar para cadastro de paciente
            window.location.href = `/paciente/novo?origem=agendamento&tipo=${tipoAgendamento}`;
        }
    }
    
    function fazerLogout() {
        fetch('/api/logout', { method: 'POST' })
            .then(() => window.location.href = '/');
    }
</script>
{% endblock %}

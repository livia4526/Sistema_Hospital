{% extends "base.html" %}

{% block content %}
<div class="main-system">
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-hospital-user"></i>
            <span>HOS - Hospital de Olhos de Sergipe</span>
        </div>
        <div class="nav-user">
            <span>👋 Bem-vindo, <span id="currentUser">{{ session.username }}</span></span>
            <button class="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </nav>
    
    <div class="dashboard" style="max-width: 800px; margin: 0 auto;">
        <div class="card">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
                <i class="fas fa-user-plus" style="font-size: 32px; color: var(--success-green);"></i>
                <h2 style="color: var(--success-green); margin: 0;">Novo Paciente</h2>
            </div>
            
            <form id="pacienteForm">
                <div class="row">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" id="nome" class="form-input" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>Data de Nascimento *</label>
                        <input type="date" id="dataNascimento" class="form-input" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Sexo</label>
                        <div class="select-wrapper">
                            <select id="sexo" class="form-select">
                                <option value="">Selecione</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Plano de Saúde</label>
                        <div class="select-wrapper">
                            <select id="plano" class="form-select">
                                <option value="">Selecione o plano</option>
                                <option value="Unimed">Unimed</option>
                                <option value="Hapvida">Hapvida</option>
                                <option value="Bradesco">Bradesco</option>
                                <option value="Plamed">Plamed</option>
                                <option value="NotreDame">NotreDame</option>
                                <option value="Particular">Particular</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group" id="outroPlanoContainer" style="display: none;">
                    <label>Especifique o plano</label>
                    <input type="text" id="outroPlano" class="form-input" placeholder="Digite o nome do plano">
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>Celular *</label>
                        <input type="tel" id="telefone" class="form-input telefone-input" placeholder="(79) 99999-9999" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" class="form-input" placeholder="exemplo@email.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>CPF *</label>
                    <input type="text" id="cpf" class="form-input cpf-input" placeholder="000.000.000-00" required>
                </div>
                
                <div class="form-group">
                    <label>Informações complementares</label>
                    <textarea id="infoComplementares" class="form-textarea" rows="3" placeholder="Ex: Diabético, Hipertenso, Alérgico..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Endereço</label>
                    <textarea id="endereco" class="form-textarea" rows="2" placeholder="Rua, número, bairro, cidade, CEP..."></textarea>
                </div>
                
                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px;">
                    <button type="button" class="btn btn-secondary" onclick="voltar()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const origem = '{{ request.args.get("origem", "") }}';
    const tipoAgendamento = '{{ request.args.get("tipo", "consulta") }}';
    
    document.addEventListener('DOMContentLoaded', function() {
        // Mostrar campo "Outros" no plano
        document.getElementById('plano').addEventListener('change', function() {
            const outroContainer = document.getElementById('outroPlanoContainer');
            if (this.value === 'Outros') {
                outroContainer.style.display = 'block';
            } else {
                outroContainer.style.display = 'none';
            }
        });
    });
    
    document.getElementById('pacienteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nome = document.getElementById('nome').value;
        const dataNascimento = document.getElementById('dataNascimento').value;
        const sexo = document.getElementById('sexo').value;
        let plano = document.getElementById('plano').value;
        const telefone = document.getElementById('telefone').value;
        const email = document.getElementById('email').value;
        const cpf = document.getElementById('cpf').value;
        const infoComplementares = document.getElementById('infoComplementares').value;
        const endereco = document.getElementById('endereco').value;
        
        if (plano === 'Outros') {
            plano = document.getElementById('outroPlano').value;
            if (!plano) {
                showNotification('Especifique o plano de saúde', 'error');
                return;
            }
        }
        
        // Validações
        if (!nome || !dataNascimento || !telefone || !cpf) {
            showNotification('Preencha todos os campos obrigatórios', 'error');
            return;
        }
        
        // Validar CPF
        const cpfNumeros = cpf.replace(/\D/g, '');
        if (cpfNumeros.length !== 11) {
            showNotification('CPF inválido. Deve conter 11 números', 'error');
            return;
        }
        
        // Validar email
        if (email && !validarEmail(email)) {
            showNotification('Email inválido', 'error');
            return;
        }
        
        const dados = {
            nome: nome,
            data_nascimento: dataNascimento,
            sexo: sexo,
            plano: plano,
            telefone: telefone,
            email: email,
            cpf: cpf,
            info_complementares: infoComplementares,
            endereco: endereco
        };
        
        fetch('/api/pacientes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showNotification('Paciente cadastrado com sucesso!');
                
                // Se veio de um agendamento, redirecionar de volta
                if (origem === 'agendamento') {
                    sessionStorage.setItem('pacienteAgendamento', JSON.stringify({
                        id: data.id,
                        nome: nome,
                        telefone: telefone,
                        plano: plano
                    }));
                    window.location.href = `/${tipoAgendamento}/nova`;
                } else {
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                }
            } else {
                showNotification(data.error || 'Erro ao cadastrar paciente', 'error');
            }
        });
    });
    
    function validarEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
    
    function voltar() {
        if (origem === 'agendamento') {
            window.location.href = `/verificar-cadastro?tipo=${tipoAgendamento}`;
        } else {
            window.location.href = '/';
        }
    }
    
    function fazerLogout() {
        fetch('/api/logout', { method: 'POST' })
            .then(() => window.location.href = '/');
    }
</script>
{% endblock %}
